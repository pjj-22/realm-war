<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="description" content="RealmWar: a real-time strategy game on a map of the real world. Claim territory, raise armies, and conquer actual places." />
    <title>RealmWar · Conquer the Real World</title>

    <!-- Cinzel: display serif for headers/labels only - body text stays on the
         Georgia system stack (src/index.css), no webfont dependency there. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Link previews. VITE_PUBLIC_URL is the site origin (no trailing slash),
         set in .env at build time; crawlers need absolute image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RealmWar" />
    <meta property="og:title" content="RealmWar · Conquer the Real World" />
    <meta property="og:description" content="A real-time strategy game on a map of the real world. Claim territory, raise armies, seize the Eiffel Tower. Free in your browser." />
    <meta property="og:url" content="%VITE_PUBLIC_URL%/" />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RealmWar · Conquer the Real World" />
    <meta name="twitter:description" content="A real-time strategy game on a map of the real world. Claim territory, raise armies, seize the Eiffel Tower. Free in your browser." />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
